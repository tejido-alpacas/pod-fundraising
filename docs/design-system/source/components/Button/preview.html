<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body data-theme="light">
<div class="ds-stage ds-stage--surface"><div class="ds-col"><p class="ds-cap">Primary · default, hover, pressed, focus, disabled, loading</p><div class="ds-row"><button type="button" class="tj-btn tj-btn--primary" ><span>Contribute</span></button><button type="button" class="tj-btn tj-btn--primary is-hover" ><span>Contribute</span></button><button type="button" class="tj-btn tj-btn--primary is-pressed" ><span>Contribute</span></button><button type="button" class="tj-btn tj-btn--primary is-focus" ><span>Contribute</span></button><button type="button" class="tj-btn tj-btn--primary" disabled ><span>Contribute</span></button><button type="button" class="tj-btn tj-btn--primary" aria-busy="true" ><span class="tj-spinner" aria-hidden="true"></span><span>Filing…</span></button></div><p class="ds-cap">Secondary</p><div class="ds-row"><button type="button" class="tj-btn tj-btn--secondary" ><span>Ask a question</span></button><button type="button" class="tj-btn tj-btn--secondary is-hover" ><span>Ask a question</span></button><button type="button" class="tj-btn tj-btn--secondary is-pressed" ><span>Ask a question</span></button><button type="button" class="tj-btn tj-btn--secondary is-focus" ><span>Ask a question</span></button><button type="button" class="tj-btn tj-btn--secondary" disabled ><span>Ask a question</span></button><button type="button" class="tj-btn tj-btn--secondary" aria-busy="true" ><span class="tj-spinner" aria-hidden="true"></span><span>Filing…</span></button></div><p class="ds-cap">Quiet</p><div class="ds-row"><button type="button" class="tj-btn tj-btn--quiet" ><span>Change something</span></button><button type="button" class="tj-btn tj-btn--quiet is-hover" ><span>Change something</span></button><button type="button" class="tj-btn tj-btn--quiet is-pressed" ><span>Change something</span></button><button type="button" class="tj-btn tj-btn--quiet is-focus" ><span>Change something</span></button><button type="button" class="tj-btn tj-btn--quiet" disabled ><span>Change something</span></button><button type="button" class="tj-btn tj-btn--quiet" aria-busy="true" ><span class="tj-spinner" aria-hidden="true"></span><span>Filing…</span></button></div><p class="ds-cap">Destructive</p><div class="ds-row"><button type="button" class="tj-btn tj-btn--destructive" ><span>Discard draft</span></button><button type="button" class="tj-btn tj-btn--destructive is-hover" ><span>Discard draft</span></button><button type="button" class="tj-btn tj-btn--destructive is-pressed" ><span>Discard draft</span></button><button type="button" class="tj-btn tj-btn--destructive is-focus" ><span>Discard draft</span></button><button type="button" class="tj-btn tj-btn--destructive" disabled ><span>Discard draft</span></button><button type="button" class="tj-btn tj-btn--destructive" aria-busy="true" ><span class="tj-spinner" aria-hidden="true"></span><span>Filing…</span></button></div><p class="ds-cap">Field size (48px) and small (32px, 44px hit area)</p><div class="ds-row"><button type="button" class="tj-btn tj-btn--primary tj-btn--field" ><span>File this entry</span></button><button type="button" class="tj-btn tj-btn--secondary tj-btn--sm" ><svg class="tj-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4.5H9"/></svg><span>Retry</span></button><button type="button" class="tj-btn tj-btn--quiet tj-btn--icon" aria-label="More"><svg class="tj-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="2.5"/></svg></button></div></div></div>
</body>
</html>
