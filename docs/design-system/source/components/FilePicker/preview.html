<!-- @dsCard group="Forms" height=330 subtitle="Camera first on phones; drop zone appears from 700px" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FilePicker</title></head>
<body data-theme="light">
<div class="tj-screen" style="overflow:visible"><div class="ds-stage"><div class="ds-grid"><div class="tj-picker">
<label class="tj-picker__opt tj-picker__opt--primary"><svg class="tj-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Take a photo</span><small>Opens the camera</small><input type="file" accept="image/*" capture="environment"></label>
<label class="tj-picker__opt"><svg class="tj-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg><span>Choose files</span><small>Photos or PDFs</small><input type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"></label>
<div class="tj-picker__drop">Or drop files here</div>
<p class="tj-picker__limits">Photos (JPG, PNG, WEBP) or PDF documents, up to 10 MB each. Up to 6 files per entry.</p></div></div></div></div>
</body>
</html>
