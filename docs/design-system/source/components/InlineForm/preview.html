<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InlineForm</title></head>
<body data-theme="light">
<div class="tj-screen" style="overflow:visible"><div class="ds-stage"><div style="max-width:520px"><div class="tj-inform"><p class="tj-inform__title">Entry details <span class="tj-badge tj-tone--neutral tj-badge--plain"><svg class="tj-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><circle cx="12" cy="11" r="3.6"/><path d="M12 9.3V11l1.2.8"/></svg><span><span class="tj-vh">Filing: </span>Draft</span></span></p>
<div class="tj-inform__grid tj-inform__grid--2">
<div class="tj-field"><label class="tj-label" for="qty">Quantity</label><span class="tj-combo"><input class="tj-input" id="qty" type="text" inputmode="decimal" value="120"><span class="tj-select-wrap"><select class="tj-select" id="qty-unit" aria-label="Unit"><option selected>bags</option><option>tonnes</option><option>pallets</option></select><svg class="tj-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></span></span></div>
<div class="tj-field"><label class="tj-label" for="amt">Amount spent <span class="tj-label__opt">(optional)</span></label><span class="tj-combo"><input class="tj-input" id="amt" type="text" inputmode="decimal" value="1,080.00"><span class="tj-select-wrap"><select class="tj-select" id="amt-unit" aria-label="Currency"><option selected>USD</option><option>XCD</option></select><svg class="tj-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></span></span></div>
<div class="tj-field"><label class="tj-label" for="date">Date</label><input class="tj-input" id="date" type="text" value="14 Nov 2026"></div>
<div class="tj-field"><label class="tj-label" for="ms">Milestone</label><span class="tj-select-wrap"><select class="tj-select" id="ms"><option selected>2 · Walls up to roof height</option><option>5 · Roof, fit-out and handover</option></select><svg class="tj-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></span></div>
</div>
<div class="tj-field"><label class="tj-label" for="desc">What was done</label><textarea class="tj-textarea" id="desc" rows="2">Cement delivered for block laying on the east and south walls.</textarea></div>
<p class="tj-inform__saved"><svg class="tj-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Saved on this phone at 16:45</p></div></div></div></div>
</body>
</html>
