<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NumberUnitField</title></head>
<body data-theme="light">
<div class="ds-stage ds-stage--surface"><div class="ds-grid"><div class="tj-field"><label class="tj-label" for="n1">Quantity</label><span class="tj-combo"><input class="tj-input" id="n1" type="text" inputmode="decimal" value="120"><span class="tj-select-wrap"><select class="tj-select" id="n1-unit" aria-label="Unit"><option selected>bags</option><option>tonnes</option><option>pallets</option></select><svg class="tj-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></span></span></div><div class="tj-field"><label class="tj-label" for="n2">Amount spent</label><span class="tj-combo"><input class="tj-input" id="n2" type="text" inputmode="decimal" value="1,080.00"><span class="tj-select-wrap"><select class="tj-select" id="n2-unit" aria-label="Unit"><option selected>USD</option><option>XCD</option></select><svg class="tj-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></span></span></div><div class="tj-field"><label class="tj-label" for="n3">How many were delivered?</label><span class="tj-combo"><input class="tj-input" id="n3" type="text" inputmode="decimal" value="" aria-invalid="true"><span class="tj-select-wrap"><select class="tj-select" id="n3-unit" aria-label="Unit"><option selected>books</option><option>boxes</option></select><svg class="tj-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></span></span><p class="tj-error" id="n3-err"><svg class="tj-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5"/><path d="M12 16v.01"/></svg>Enter how many books were delivered.</p></div><div class="tj-field"><label class="tj-label" for="n4">Budget for this milestone</label><span class="tj-combo"><span class="tj-combo__affix" aria-hidden="true">$</span><input class="tj-input" id="n4" type="text" inputmode="decimal" value="24,800"></span></div></div></div>
