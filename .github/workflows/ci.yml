name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm is the only package manager; package-lock.json is the only lockfile.
      - name: No other lockfiles
        run: |
          if git ls-files | grep -E '(^|/)(pnpm-lock\.yaml|yarn\.lock|bun\.lockb?)$'; then
            echo "Remove the lockfile above. This repository uses npm only." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Checks the Terraform in infra/ is well formed. It needs no Cloudflare credentials:
  # validate downloads the provider and reads the configuration, and never contacts an account.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
