name: End-to-end

# Signs in to the LIVE site through real Qatom and walks it, keeping screenshots. See e2e/README.md.
#
# It runs after every successful release of `main`, and by hand from the Actions tab. The paid
# story (real filing deposits from the two test people's wallets) tells itself after a release,
# at most once in the time set below, and never in a run started by hand. It is a workflow of
# its own, so it can never fail or hold up a deploy.
#
# UNTIL E2E_FAST_UNTIL (below) it also starts by itself every five minutes, so paid stories
# follow one another without waiting for a release: the owner, 15 November 2026, "paid runs
# should go every 5 minutes please", "just for the next 24 hours". After that moment a run the
# timer starts ends at its first step and does nothing. Remove the `schedule` block then.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  # Lets the job prove to AWS that it is this repository's `main`. There is no AWS key anywhere.
  id-token: write
  # Lets the job read this workflow's own recent runs, to see how many of them signed in.
  actions: read

# One run at a time: the two test people and their inbox are shared. A run that has started is
# never cancelled, least of all in the middle of a paid filing.
concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    # After CI: only when that run was a push to `main` and every job in it, the deploy
    # included, succeeded. By hand, and on the five-minute timer: always.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # None of these is a secret. The three from `vars` are set once by a person, from the
      # outputs of the Qatom infrastructure that receives the test people's mail.
      E2E_INBOX_QUEUE_URL: ${{ vars.E2E_INBOX_QUEUE_URL }}
      E2E_INBOX_DOMAIN: ${{ vars.E2E_INBOX_DOMAIN }}
      E2E_AWS_ROLE_ARN: ${{ vars.E2E_AWS_ROLE_ARN }}
      E2E_INBOX_REGION: ca-central-1
      # The same Qatom the live site signs people in with (PAYMENT_API_URL in ci.yml).
      E2E_QATOM_HOST: pay.m.todaq.net
      # The test campaign and its two people, as `npm run db:seed:e2e:sql` writes them.
      E2E_CAMPAIGN_ID: e2e-smoke
      E2E_CONTRACTOR_PARTY_ID: e2e-contractor
      E2E_CONFIRMER_PARTY_ID: e2e-confirmer
      # At most one paid story starts within this many minutes. One number, easy to change.
      E2E_PAID_EVERY_MINUTES: 15
      # The fast pace the owner asked for, for 24 hours. Until this moment (UTC) the five-minute
      # timer above starts runs and a paid story may start every E2E_FAST_EVERY_MINUTES. After
      # it the timer's runs do nothing and the number above applies again.
      E2E_FAST_UNTIL: '2026-11-16T11:30:00Z'
      E2E_FAST_EVERY_MINUTES: 5
      # The campaign a paid run creates is titled with this, so it can be found and removed.
      E2E_RUN_LABEL: ${{ github.run_number }}
    steps:
      # Until a person has set the three variables, there is no inbox to read a sign-in code
      # from. The run then ends here, green, with a notice. It never fails for this.
      - name: Check that the inbox is set up
        id: inbox
        run: |
          # The five-minute timer is for the fast pace only. Once its time is over, a run it
          # starts ends here, green, having done nothing.
          if [[ $GITHUB_EVENT_NAME == schedule && ! $(date -u +%Y-%m-%dT%H:%M:%SZ) < $E2E_FAST_UNTIL ]]; then
            echo "::notice::The five-minute timer's time ended at $E2E_FAST_UNTIL, so this run does nothing. Remove the schedule block from this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in E2E_INBOX_QUEUE_URL E2E_INBOX_DOMAIN E2E_AWS_ROLE_ARN; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::notice::End-to-end run skipped. These repository variables are not set: ${missing[*]}. Add them under Settings, Secrets and variables, Actions, Variables. See e2e/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # After a deploy: the commit that was just released, so the suite matches the live site.
      - uses: actions/checkout@v4
        if: steps.inbox.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.inbox.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.inbox.outputs.ready == 'true'

      - name: Install Chromium for Playwright
        if: steps.inbox.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Short-lived credentials for the role that may read the inbox queue, and nothing else.
      # AWS trusts this repository's `main` only, so a run from any other branch stops here.
      - name: Assume the inbox role
        if: steps.inbox.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.E2E_AWS_ROLE_ARN }}
          aws-region: ca-central-1

      # Qatom gives each address 5 sign-in codes in each fixed quarter-hour (:00, :15, :30, :45
      # UTC), and several releases close together would spend them. So at most 3 runs sign in per
      # quarter-hour; a run beyond that walks only the signed-out pages and says so. A run started
      # by hand always signs in. If the count cannot be read, the run does not sign in.
      - name: Decide whether this run signs in
        id: signin
        if: steps.inbox.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_IN_STEP: Note that this run signs in
          RUNS_PER_QUARTER_HOUR: 3
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            echo "::notice::This run was started by hand, so it signs in."
            echo "sign_in=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Qatom counts codes in fixed quarter-hours: from :00, :15, :30 and :45 UTC.
          since=$(date -u -d "@$(( $(date +%s) / 900 * 900 ))" +%Y-%m-%dT%H:%M:%SZ)
          signed_in=0
          if ! recent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?per_page=30" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .run_started_at >= \"$since\") | .id"); then
            echo "::warning::Could not read this workflow's recent runs, so this run does not sign in. The signed-out checks still run."
            echo "sign_in=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for run in $recent; do
            if ! steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq "[.jobs[].steps[]? | select(.name == \"$SIGN_IN_STEP\" and .conclusion == \"success\")] | length"); then
              echo "::warning::Could not read run $run, so this run does not sign in. The signed-out checks still run."
              echo "sign_in=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ((steps > 0)); then signed_in=$((signed_in + 1)); fi
          done
          if ((signed_in >= RUNS_PER_QUARTER_HOUR)); then
            echo "::notice::This run does not sign in: $signed_in runs have signed in since $since, and Qatom limits sign-in codes per quarter-hour. The signed-out checks still run."
            echo "sign_in=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This run signs in: $signed_in earlier runs have signed in since $since."
            echo "sign_in=true" >> "$GITHUB_OUTPUT"
          fi

      # Later runs count this step to know that this run asked Qatom for codes. Its name is
      # SIGN_IN_STEP above: change both together.
      - name: Note that this run signs in
        if: steps.inbox.outputs.ready == 'true' && steps.signin.outputs.sign_in == 'true'
        run: echo "This run asks Qatom for one sign-in code for each of the two test people."

      # The paid story files a work log, a milestone claim and its confirmation as the two test
      # people: 2.10 in real deposits, on a campaign the run creates. It tells itself, after a
      # release or on the five-minute timer while the fast pace lasts, never by hand (CLAUDE.md,
      # "Never move money to test something"). Earlier paid runs are the ones whose job has the
      # step named below, finished. If they cannot be read, the run is unpaid.
      - name: Decide whether this run tells the paid story
        id: paid
        if: steps.inbox.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAID_STEP: Note that this run tells the paid story
          SIGNS_IN: ${{ steps.signin.outputs.sign_in }}
          THIS_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          unpaid() { say "$1"; echo "paid=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # The gap between paid stories: the fast one until E2E_FAST_UNTIL, the usual one after.
          every=$E2E_PAID_EVERY_MINUTES
          if [[ $(date -u +%Y-%m-%dT%H:%M:%SZ) < $E2E_FAST_UNTIL ]]; then every=$E2E_FAST_EVERY_MINUTES; fi

          [[ $GITHUB_EVENT_NAME == workflow_run || $GITHUB_EVENT_NAME == schedule ]] || unpaid "Unpaid run: it was started by hand. The paid story only runs by itself."
          [[ $SIGNS_IN == true ]] || unpaid "Unpaid run: this run does not sign in, so it cannot file."

          if ! runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?per_page=30" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\") | [.id, .run_started_at, .conclusion, .head_sha] | @tsv"); then
            echo "::warning::Could not read this workflow's recent runs, so this run is unpaid."
            unpaid "Unpaid run: the earlier runs could not be read."
          fi

          # The paid runs among them, newest first: when each started, how it ended, on which commit.
          paid_runs=()
          while IFS=$'\t' read -r id started conclusion sha; do
            [[ -n $id ]] || continue
            if ! found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq "[.jobs[].steps[]? | select(.name == \"$PAID_STEP\" and .conclusion == \"success\")] | length"); then
              echo "::warning::Could not read run $id, so this run is unpaid."
              unpaid "Unpaid run: an earlier run could not be read."
            fi
            if ((found > 0)); then paid_runs+=("$started $conclusion $sha"); fi
          done <<< "$runs"

          if ((${#paid_runs[@]} > 0)); then
            read -r last_started last_conclusion last_sha <<< "${paid_runs[0]}"
            since=$(date -u -d "$every minutes ago" +%Y-%m-%dT%H:%M:%SZ)
            if [[ $last_started > $since ]]; then
              unpaid "Unpaid run: a paid story started at $last_started, and at most one starts every $every minutes."
            fi
            if ((${#paid_runs[@]} > 1)); then
              read -r _ before_conclusion _ <<< "${paid_runs[1]}"
              if [[ $last_conclusion != success && $before_conclusion != success ]]; then
                if [[ $last_sha == "$THIS_COMMIT" ]]; then
                  echo "::warning title=End-to-end: the paid story is stopped::The last two paid runs were red. No more deposits are spent until a new release, which gets one try. Read the last paid run's failure first."
                  unpaid "Unpaid run: THE PAID STORY IS STOPPED. The last two paid runs were red, and this release has had its try."
                fi
                echo "::warning title=End-to-end: one more try at the paid story::The last two paid runs were red. This is a new release, so it gets one try."
              fi
            fi
          fi
          say "PAID run: it creates its own campaign and files a work log (0.10), a milestone claim (1.00) and its confirmation (1.00) from the two test people's agent wallets."
          echo "paid=true" >> "$GITHUB_OUTPUT"

      # Later runs count this step to know that this run was paid. Its name is PAID_STEP above:
      # change both together.
      - name: Note that this run tells the paid story
        if: steps.inbox.outputs.ready == 'true' && steps.paid.outputs.paid == 'true'
        run: echo "This run spends up to 2.10 in real deposits from the two test people's agent wallets."

      - name: Run the end-to-end suite
        if: steps.inbox.outputs.ready == 'true'
        env:
          # "true" makes the suite skip the sign-in and every check that needs a signed-in person.
          E2E_SKIP_SIGN_IN: ${{ steps.signin.outputs.sign_in == 'true' && 'false' || 'true' }}
          # "true" only when the step above decided this run tells the paid story.
          E2E_PAID: ${{ steps.paid.outputs.paid == 'true' && 'true' || 'false' }}
        run: npm run e2e

      # Always, pass or fail: the screenshots are how a person reads what happened. Only this
      # folder is uploaded. The signed-in browser state is kept outside it and is never uploaded.
      - name: Keep the screenshots and the report
        if: always() && steps.inbox.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_number }}-${{ github.run_attempt }}
          path: e2e/artifacts
          retention-days: 7
          if-no-files-found: warn
